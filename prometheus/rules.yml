groups:
  - name: cafeplanalto_slo_e_disponibilidade
    rules:
      - alert: APIIndisponivel
        expr: up{job="api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API da loja indisponivel"
          description: "Prometheus nao consegue coletar metricas em {{ $labels.instance }}."

      - alert: LojaIndisponivel
        expr: probe_success{job="blackbox_http"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Sonda HTTP da filial falhou"
          description: "Falha ao acessar {{ $labels.instance }} a partir da filial."

      - alert: SondaDNSFalhando
        expr: probe_success{job="blackbox_dns"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Resolucao DNS da loja falhando"
          description: "Falha na consulta DNS em {{ $labels.instance }}."

      - alert: SondaICMPFalhando
        expr: probe_success{job="blackbox_icmp"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Latencia/alcance ICMP falhando"
          description: "Falha de ping ICMP para {{ $labels.instance }}."

      - alert: ViolacaoSLOLatenciaP95
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.300
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "SLO de latencia p95 (> 300 ms) violado"
          description: "Latencia p95 atual da API excedeu 300 ms."

      - alert: TaxaErrosHTTPAlta
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total[5m])), 0.001)
          ) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Mais de 5% de respostas HTTP 5xx"
          description: "Taxa de erro 5xx acima do limite de 5% em janela de 5m."

      - alert: ExporterOuBancoIndisponivel
        expr: up{job=~"node_exporter|cadvisor|postgres_exporter|nginx_exporter"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Exporter/coletor indisponivel"
          description: "Job {{ $labels.job }} ({{ $labels.instance }}) sem coleta."
