server {
    listen 80;
    server_name loja.cafeplanalto.lab web.cafeplanalto.lab;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location ~ ^/(produtos|pedidos|health)$ {
        proxy_pass http://172.20.10.21:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.20.99.0/24;
        deny all;
    }
}
