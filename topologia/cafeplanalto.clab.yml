
name: cafeplanalto

topology:
  nodes:
    r-matriz:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/r-matriz/frr.conf
      daemons:
        - staticd

    r-filial:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/r-filial/frr.conf
      daemons:
        - staticd

    br-servicos:
      kind: bridge

    br-gestao:
      kind: bridge

    br-filial:
      kind: bridge

  links:
    - endpoints: ["r-matriz:eth1", "r-filial:eth1"]

    - endpoints: ["r-matriz:eth2", "br-servicos:eth1"]

    - endpoints: ["r-matriz:eth3", "br-gestao:eth1"]

    - endpoints: ["r-filial:eth2", "br-filial:eth1"]
