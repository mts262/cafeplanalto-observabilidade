name: cafeplanalto

mgmt:
  network: clab-mgmt
  ipv4-subnet: 172.30.0.0/24

topology:
  nodes:
    r-matriz:
      kind: frr
      image: cafeplanalto/roteador:latest
      binds:
        - ../imagens/roteador/snmpd.conf:/etc/snmp/snmpd.conf:ro
      exec:
        - snmpd -C -c /etc/snmp/snmpd.conf -Lf /var/log/snmpd.log -p /var/run/snmpd.pid
      startup-config: configs/r-matriz/frr.conf
      enforce-startup-config: true
      daemons:
        - staticd

    r-filial:
      kind: frr
      image: cafeplanalto/roteador:latest
      binds:
        - ../imagens/roteador/snmpd.conf:/etc/snmp/snmpd.conf:ro
      exec:
        - snmpd -C -c /etc/snmp/snmpd.conf -Lf /var/log/snmpd.log -p /var/run/snmpd.pid
      startup-config: configs/r-filial/frr.conf
      enforce-startup-config: true
      daemons:
        - staticd

    br-servicos:
      kind: bridge

    br-gestao:
      kind: bridge

    br-filial:
      kind: bridge

    dns:
      kind: linux
      image: cafeplanalto/dns:latest
      binds:
        - ../dns/Corefile:/etc/coredns/Corefile:ro
        - ../dns/cafeplanalto.lab.zone:/etc/coredns/cafeplanalto.lab.zone:ro
      exec:
        - ip addr add 172.20.10.10/24 dev eth1
        - ip route add 172.20.0.0/16 via 172.20.10.1
        - ip route add 10.0.0.0/30 via 172.20.10.1

    db:
      kind: linux
      image: postgres:16-alpine
      env:
        POSTGRES_USER: loja
        POSTGRES_PASSWORD: loja123
        POSTGRES_DB: loja
      binds:
        - ../app/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      exec:
        - ip addr add 172.20.10.22/24 dev eth1
        - ip route add 172.20.0.0/16 via 172.20.10.1
        - ip route add 10.0.0.0/30 via 172.20.10.1

    api:
      kind: linux
      image: cafeplanalto/api:latest
      env:
        DB_HOST: db.cafeplanalto.lab
        DB_USER: loja
        DB_PASSWORD: loja123
        DB_NAME: loja
      exec:
        - ip addr add 172.20.10.21/24 dev eth1
        - ip route add 172.20.0.0/16 via 172.20.10.1
        - ip route add 10.0.0.0/30 via 172.20.10.1
        - sh -c 'echo "nameserver 172.20.10.10" > /etc/resolv.conf'

    web:
      kind: linux
      image: nginx:alpine
      binds:
        - ../imagens/web/default.conf:/etc/nginx/conf.d/default.conf:ro
        - ../imagens/web/index.html:/usr/share/nginx/html/index.html:ro
      exec:
        - ip addr add 172.20.10.20/24 dev eth1
        - ip route add 172.20.0.0/16 via 172.20.10.1
        - ip route add 10.0.0.0/30 via 172.20.10.1

    zabbix-db:
      kind: linux
      image: postgres:16-alpine
      env:
        POSTGRES_USER: zabbix
        POSTGRES_PASSWORD: zabbix123
        POSTGRES_DB: zabbix
      exec:
        - ip addr add 172.20.99.12/24 dev eth1
        - ip route add 172.20.0.0/16 via 172.20.99.1
        - ip route add 10.0.0.0/30 via 172.20.99.1

    zabbix-server:
      kind: linux
      image: zabbix/zabbix-server-pgsql:alpine-8.0-latest
      user: root
      env:
        DB_SERVER_HOST: 172.20.99.12
        POSTGRES_USER: zabbix
        POSTGRES_PASSWORD: zabbix123
        POSTGRES_DB: zabbix
      exec:
        - ip addr add 172.20.99.10/24 dev eth1
        - ip route add 172.20.0.0/16 via 172.20.99.1
        - ip route add 10.0.0.0/30 via 172.20.99.1
        - sh -c 'echo "nameserver 172.20.10.10" > /etc/resolv.conf'

    zabbix-web:
      kind: linux
      image: zabbix/zabbix-web-nginx-pgsql:alpine-8.0-latest
      user: root
      ports:
        - 8080:8080
      env:
        DB_SERVER_HOST: 172.20.99.12
        POSTGRES_USER: zabbix
        POSTGRES_PASSWORD: zabbix123
        POSTGRES_DB: zabbix
        ZBX_SERVER_HOST: 172.20.99.10
        ZBX_SERVER_NAME: "Cafe Planalto"
        PHP_TZ: America/Bahia
      exec:
        - ip addr add 172.20.99.11/24 dev eth1
        - ip route add 172.20.0.0/16 via 172.20.99.1
        - ip route add 10.0.0.0/30 via 172.20.99.1
        - sh -c 'echo "nameserver 172.20.10.10" > /etc/resolv.conf'

    agent-dns:
      kind: linux
      image: zabbix/zabbix-agent2:alpine-8.0-latest
      network-mode: container:dns
      env:
        ZBX_SERVER_HOST: 172.20.99.10
        ZBX_HOSTNAME: dns
        ZBX_ACTIVE_ALLOW: "false"

    agent-web:
      kind: linux
      image: zabbix/zabbix-agent2:alpine-8.0-latest
      network-mode: container:web
      env:
        ZBX_SERVER_HOST: 172.20.99.10
        ZBX_HOSTNAME: web
        ZBX_ACTIVE_ALLOW: "false"

    agent-api:
      kind: linux
      image: zabbix/zabbix-agent2:alpine-8.0-latest
      network-mode: container:api
      env:
        ZBX_SERVER_HOST: 172.20.99.10
        ZBX_HOSTNAME: api
        ZBX_ACTIVE_ALLOW: "false"

    agent-db:
      kind: linux
      image: zabbix/zabbix-agent2:alpine-8.0-latest
      network-mode: container:db
      env:
        ZBX_SERVER_HOST: 172.20.99.10
        ZBX_HOSTNAME: db
        ZBX_ACTIVE_ALLOW: "false"

    cliente-carga:
      kind: linux
      image: cafeplanalto/carga:latest
      binds:
        - ../carga/loja.js:/carga/loja.js:ro
        - ../carga/entrypoint.sh:/carga/entrypoint.sh:ro
      cmd: sh /carga/entrypoint.sh
      exec:
        - ip addr add 172.20.20.20/24 dev eth1
        - ip route add 172.20.0.0/16 via 172.20.20.1
        - ip route add 10.0.0.0/30 via 172.20.20.1
        - sh -c 'echo "nameserver 172.20.10.10" > /etc/resolv.conf'


    prometheus:
      kind: linux
      image: prom/prometheus:v3.16.0
      ports:
        - 9090:9090
      binds:
        - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        - ../prometheus/rules.yml:/etc/prometheus/rules.yml:ro
        - ../dados/prometheus:/prometheus
      cmd: --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=3d
      exec:
        - ip addr add 172.20.99.20/24 dev eth1
        - ip route add 172.20.0.0/16 via 172.20.99.1

    grafana:
      kind: linux
      image: grafana/grafana:13.3.2
      ports:
        - 3000:3000
      env:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: admin
        GF_USERS_ALLOW_SIGN_UP: "false"
      binds:
        - ../grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
        - ../grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
        - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
        - ../dados/grafana:/var/lib/grafana
      exec:
        - ip addr add 172.20.99.22/24 dev eth1
        - ip route add 172.20.0.0/16 via 172.20.99.1

    alertmanager:
      kind: linux
      image: prom/alertmanager:v0.35.1
      ports:
        - 9093:9093
      binds:
        - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      cmd: --config.file=/etc/alertmanager/alertmanager.yml
      exec:
        - ip addr add 172.20.99.21/24 dev eth1
        - ip route add 172.20.0.0/16 via 172.20.99.1

    loki:
      kind: linux
      image: grafana/loki:3.7.10
      binds:
        - ../loki/config.yml:/etc/loki/config.yml:ro
        - ../dados/loki:/loki
      cmd: -config.file=/etc/loki/config.yml

    alloy:
      kind: linux
      image: grafana/alloy:v1.22.0
      user: root
      binds:
        - ../alloy/config.alloy:/etc/alloy/config.alloy:ro
        - /var/run/docker.sock:/var/run/docker.sock
      cmd: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy

    blackbox:
      kind: linux
      image: prom/blackbox-exporter:v0.29.1
      binds:
        - ../blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      cmd: --config.file=/etc/blackbox/blackbox.yml
      exec:
        - ip addr add 172.20.20.30/24 dev eth1
        - ip route add 172.20.0.0/16 via 172.20.20.1
        - sh -c 'echo "nameserver 172.20.10.10" > /etc/resolv.conf'

  links:
    - endpoints: ["r-matriz:eth1", "r-filial:eth1"]
    - endpoints: ["r-matriz:eth2", "br-servicos:svc1"]
    - endpoints: ["r-matriz:eth3", "br-gestao:gest1"]
    - endpoints: ["r-filial:eth2", "br-filial:fil1"]
    - endpoints: ["dns:eth1", "br-servicos:dns1"]
    - endpoints: ["db:eth1", "br-servicos:db1"]
    - endpoints: ["api:eth1", "br-servicos:api1"]
    - endpoints: ["web:eth1", "br-servicos:web1"]
    - endpoints: ["zabbix-db:eth1", "br-gestao:zdb1"]
    - endpoints: ["zabbix-server:eth1", "br-gestao:zsrv1"]
    - endpoints: ["zabbix-web:eth1", "br-gestao:zweb1"]
    - endpoints: ["cliente-carga:eth1", "br-filial:carga1"]

    - endpoints: ["prometheus:eth1", "br-gestao:prom1"]
    - endpoints: ["grafana:eth1", "br-gestao:graf1"]
    - endpoints: ["alertmanager:eth1", "br-gestao:am1"]
    - endpoints: ["loki:eth1", "br-gestao:loki1"]
    - endpoints: ["alloy:eth1", "br-gestao:alloy1"]
    - endpoints: ["blackbox:eth1", "br-filial:probe1"]
