name: cafeplanalto

topology:
  nodes:
    r-matriz:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/r-matriz/frr.conf
      daemons:
        - staticd

    r-filial:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/r-filial/frr.conf
      daemons:
        - staticd

    sw-matriz-servicos:
      kind: bridge

    sw-matriz-gestao:
      kind: bridge

    sw-filial:
      kind: bridge

  links:
    - endpoints: ["r-matriz:eth1", "r-filial:eth1"]

    - endpoints: ["r-matriz:eth2", "sw-matriz-servicos:eth1"]

    - endpoints: ["r-matriz:eth3", "sw-matriz-gestao:eth1"]

    - endpoints: ["r-filial:eth2", "sw-filial:eth1"]